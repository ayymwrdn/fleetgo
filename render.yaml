services:
  - type: web
    name: fleetgo
    runtime: docker
    repo: https://github.com/username/fleetgo
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: fleetgo-db
          property: connectionString
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan optimize
    startCommand: |
      php artisan migrate --force
      php artisan serve --host=0.0.0.0 --port=8000

databases:
  - name: fleetgo-db
    plan: free
    databaseName: fleetgo
    user: fleetgo_user