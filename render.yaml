services:
  - type: web
    name: fleetgo
    runtime: docker
    repo: https://github.com/ayymwrdn/fleetgo
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: fleetgo-db
          property: connectionString

databases:
  - name: fleetgo-db
    plan: free